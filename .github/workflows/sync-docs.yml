name: Sync docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source docs
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout yusulike.github.io
        uses: actions/checkout@v4
        with:
          repository: yusulike/yusulike.github.io
          ref: main
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages

      - name: Sync docs/ to smartglass-scanner/
        run: |
          mkdir -p pages/smartglass-scanner
          rsync -av --delete src/docs/ pages/smartglass-scanner/

      - name: Commit and push if changed
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A smartglass-scanner
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync SmartGlass Scanner docs from smartglass_scanner"
          git push origin main
